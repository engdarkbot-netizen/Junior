[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.healthcheck]
path = "/api/health"
initialDelaySeconds = 60
periodSeconds = 30
timeoutSeconds = 10
successThreshold = 1
failureThreshold = 3
